services:
  postgres:
    image: postgres:16-alpine
    container_name: sentrymesh-postgres

    environment:
      POSTGRES_USER: sentrymesh
      POSTGRES_PASSWORD: sentrymesh
      POSTGRES_DB: sentrymesh

    ports:
      - "5432:5432"

    volumes:
      - sentrymesh-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U sentrymesh -d sentrymesh"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile

    container_name: sentrymesh-gateway

    ports:
      - "8080:8080"

    environment:
      SENTRYMESH_ROOT: /app
      DATABASE_URL: postgresql://sentrymesh:sentrymesh@postgres:5432/sentrymesh

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "-",
          "http://localhost:8080/health"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

    restart: unless-stopped

volumes:
  sentrymesh-postgres-data:
